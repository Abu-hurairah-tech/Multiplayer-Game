<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Arena Shooter</title>
    <style>
      /* 1. Reset all default browser margins and padding */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 2. Lock the body to the exact screen size and kill scrollbars */
      body {
        margin: 0;
        overflow: hidden;
        background-color: #222;
        font-family: monospace, sans-serif;
        color: white;
      }

      /* 3. Target the main scoreboard container (Top-Left) */
      #score-list {
        position: absolute;
        top: 15px;
        left: 15px;
        display: flex;
        flex-direction: column; /* Stack stats vertically */
        gap: 8px; /* Add clean spacing between players */
        max-height: calc(
          100vh - 30px
        ); /* Stop exactly at the bottom of the screen */
        flex-wrap: wrap; /* If it hits the bottom, wrap to a new column instead of scrolling */
        z-index: 10;
        pointer-events: none; /* Allow mouse clicks to pass through the UI into the game */
      }

      /* Target individual player stat rows */
      .player-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(
          0,
          0,
          0,
          0.5
        ); /* Slight dark backing for readability */
        padding: 4px 8px;
        border-radius: 4px;
      }

      .color-box {
        width: 12px;
        height: 12px;
        border: 1px solid #fff;
      }

      /* 4. Move the Turret status to the opposite side of the screen (Top-Right) */
      #turret-status {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
        z-index: 10;
        pointer-events: none;
        font-weight: bold;
        font-size: 16px;
        text-transform: uppercase;
      }

      /* 5. Center the game canvas perfectly in the window */
      #canvas-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      /* 6. Make the canvas responsive so it never exceeds the screen */
      canvas {
        background-color: #111;
        border: 4px solid #444;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);

        /* The secret sauce for keeping it on one screen */
        max-width: 95vw;
        max-height: 85vh;
        object-fit: contain; /* Keeps the 800x600 aspect ratio intact without stretching */
      }
    </style>
  </head>
  <body>
    <!-- Name Input Overlay (Added right after <body>) -->
    <div
      id="name-overlay"
      style="
        display: none; /* Hidden by default until JS checks local storage */
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.95);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
      "
    >
      <h1 style="color: white; margin-bottom: 20px; font-family: monospace;">ENTER YOUR NAME</h1>
      <input
        type="text"
        id="player-name-input"
        maxlength="12"
        autocomplete="off"
        style="
          padding: 12px;
          font-size: 20px;
          text-align: center;
          font-family: monospace;
          border: 2px solid #555;
          background: #222;
          color: white;
          border-radius: 6px;
          outline: none;
          text-transform: uppercase;
        "
        placeholder="PLAYER NAME"
      />
      <!-- The Red Error Message -->
      <div
        id="name-error"
        style="
          color: #ff4c4c;
          font-family: monospace;
          font-size: 14px;
          margin-top: 10px;
          opacity: 0;
          transition: opacity 0.2s;
        "
      >
        Name cannot be empty!
      </div>
      <button
        id="join-btn"
        style="
          margin-top: 20px;
          padding: 12px 40px;
          font-size: 18px;
          font-family: monospace;
          font-weight: bold;
          background: #4caf50;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        "
      >
        JOIN ARENA
      </button>
    </div>
    <!-- UI Overlay (Floating on top of the canvas) -->
    <div id="score-list"></div>
    <div id="turret-status">Turret: 0/3 Kills</div>

    <!-- Rejection Screen (Hidden by default) -->
    <div
      id="full-screen-overlay"
      style="
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.85);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      "
    >
      <h1 style="color: #ff4c4c; font-size: 48px; margin-bottom: 10px">
        LOBBY IS FULL
      </h1>
      <p style="font-size: 18px">
        This arena has reached its 8-player maximum.
      </p>
      <p style="font-size: 14px; color: #aaa; margin-top: 20px">
        Please try again later.
      </p>
    </div>

    <!-- The Game Canvas Wrapper -->
    <div id="canvas-container">
      <!-- The Game Canvas (Server logic still uses 800x600 coordinate space) -->
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Connect your client script -->
    <script src="engine.js"></script>
  </body>
</html>
